<div class="gallery-modal">
  <div class="gallery-modal__content">
    <div class="gallery-modal__content-left">
      <img
        class="gallery-modal__img"
        src="img/gallery/painting/slide-3--1920.jpg"
        alt="Изображение"
      />
    </div>
    <div class="gallery-modal__content-right">
      <button class="gallery-modal__close btn-reset">
        <svg class="icon icon-modal-close">
          <use xlink:href="img/sprite.svg#icon-modal-close"></use>
        </svg>
      </button>
      <div class="gallery-modal__header">
        <h3 class="gallery-modal__title">Казимир Малевич</h3>
        <strong class="gallery-modal__subtitle">“Женщина с граблями”</strong>
        <p class="gallery-modal__date">
          <time datetime="1931">1931</time>
          -
          <time datetime="1932">1932</time>
        </p>
      </div>
      <p class="gallery-modal__text">
        Картина из второй серии крестьянского цикла работ Казимира Малевича. Художник принялся за её
        создание в 1930-1931 годах, после того, как первый цикл был утерян после Берлинской и
        Варшавской выставок в 1927 году.
      </p>
    </div>
  </div>
</div>
