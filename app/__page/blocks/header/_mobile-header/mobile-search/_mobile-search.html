<div class="mobile-header__search mobile-search">
  <button class="mobile-search-btn__open btn-reset" aria-label="Поиск"></button>
  <form
    class="mobile-search__form mobile-search-form"
    action="https://jsonplaceholder.typicode.com/posts"
    method="POST"
    aria-label="Поиск"
  >
    <button
      class="mobile-search-form-btn__open btn-reset"
      type="submit"
      aria-label="Поиск"
    ></button>
    <input class="mobile-search-form__input" type="text" name="search" />
    <div class="mobile-search-form-btn__wrap">
      <button
        class="mobile-search-form-btn__close btn-reset"
        aria-label="Закрыть поиск"
        type="reset"
      ></button>
    </div>
  </form>
</div>
