<article class="slider-events__article article-events">
  <div class="article-events__img-wrap">
    <picture>
      <source media="(min-width:1921px)" srcset="img/events/@@img--3840.webp" type="image/webp">
      <source media="(min-width:1921px)" srcset="img/events/@@img--3840.jpg" type="image/jpeg">
      <source media="(min-width:1200px)" srcset="img/events/@@img--1920.webp" type="image/webp">
      <source media="(min-width:1200px)" srcset="img/events/@@img--1920.jpg" type="image/jpeg">
      <source media="(min-width:1024px)" srcset="img/events/@@img--1024.webp" type="image/webp">
      <source media="(min-width:1024px)" srcset="img/events/@@img--1024.jpg" type="image/jpeg">
      <source media="(min-width:768px)" srcset="img/events/@@img--768.webp" type="image/webp">
      <source media="(min-width:768px)" srcset="img/events/@@img--768.jpg" type="image/jpeg">
      <source media="(max-width:767.98px)" srcset="img/events/@@img--320.webp" type="image/webp">
      <source media="(max-width:767.98px)" srcset="img/events/@@img--320.jpg" type="image/jpeg">
      <img class="article-events__img" src="img/events/@@img--1920.jpg" alt="Событие">
    </picture>
  </div>
  <div class="article-events__content">
    <div class="article-events__place">
      @@place
      @@time
    </div>
    <div class="article-events__content-top">
      <h3 class="article-events__title">
        @@title
      </h3>
      <p class="article-events__text">
        @@text
      </p>
    </div>
    <div class="article-events__content-bottom">
      <a href="#" class="article-events__link link-focus">Подробнее</a>
    </div>
  </div>
</article>
