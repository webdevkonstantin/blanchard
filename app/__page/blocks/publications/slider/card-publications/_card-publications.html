<div class="slider-publications__card card-publications swiper-slide">
  <div class="card-publications__img-wrap">
    <picture>
      <source media="(min-width:1921px)" srcset="img/publications/@@img--3840.webp" type="image/webp">
      <source media="(min-width:1921px)" srcset="img/publications/@@img--3840.jpg" type="image/jpeg">
      <source media="(min-width:1200px)" srcset="img/publications/@@img--1920.webp" type="image/webp">
      <source media="(min-width:1200px)" srcset="img/publications/@@img--1920.jpg" type="image/jpeg">
      <source media="(min-width:1024px)" srcset="img/publications/@@img--1024.webp" type="image/webp">
      <source media="(min-width:1024px)" srcset="img/publications/@@img--1024.jpg" type="image/jpeg">
      <source media="(min-width:768px)" srcset="img/publications/@@img--768.webp" type="image/webp">
      <source media="(min-width:768px)" srcset="img/publications/@@img--768.jpg" type="image/jpeg">
      <source media="(max-width:767.98px)" srcset="img/publications/@@img--320.webp" type="image/webp">
      <source media="(max-width:767.98px)" srcset="img/publications/@@img--320.jpg" type="image/jpeg">
      <img class="card-publications__img" src="img/publications/@@img--1920.jpg" alt="изображение-1">
    </picture>
  </div>
  <div class="card-publications__info">
    <h4 class="card-publications__title">@@title</h4>
    <span class="card-publications__price">@@price</span>
    <div class="card-publications__author">@@author</div>
  </div>
  <div class="card-publications__action">
    <button class="card-publications__btn btn transparent-focus">Заказать</button>
  </div>
</div>
