<div class="panel-country__right accordion-figure">

      <span class="accordion-figure__title">C 1400 по 1499 гг.</span>
      <span class="accordion-figure__icon"></span>

    <div class="accordion-figure__content">

      }
    </div>
  </div>
  @@include('tmp/_accordion-figure-items.html')
</div>
